[package]
name = "lorevell-py"
version = "2.0.0"
edition = "2021"
description = "PyO3 bindings and CLI for the Lorevell Markdown knowledge vault"
license = "MIT"
authors = ["Archit Singh <archit15singh@gmail.com>"]
repository = "https://github.com/archit15singh/lorevell"
publish = false

[lib]
name = "lorevell"
crate-type = ["cdylib"]

[features]
default = ["embeddings"]
embeddings = ["lorevell-core/embeddings"]

[dependencies]
lorevell-core = { path = "../lorevell-core" }
pyo3 = { version = "0.22", features = ["abi3-py39"] }
serde_json = "1"
serde = "1"
uuid = { version = "1", features = ["v4"] }