<!doctype html>
<!-- Throwaway UI study: three layouts for recall and care. Dummy data, memory-only state. -->
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memori — a little wiser, every time</title>
<style>
:root{color-scheme:dark;--bg:#111714;--panel:#18201b;--line:#303c33;--muted:#a8b6aa;--ink:#edf1e8;--accent:#c7e9a0;--soft:#283721}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 'Avenir Next',Avenir,sans-serif}button,input,select{font:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 14px}button:hover{background:var(--soft)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}a{color:var(--accent)}button.primary{background:var(--accent);color:#182411;border-color:var(--accent);font-weight:700}button:disabled{opacity:.5;cursor:default}.eyebrow{font:11px/1.5 ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin:0}h1,h2{font-family:Palatino,'Book Antiqua',serif;font-weight:400;line-height:1.16}h1{font-size:clamp(34px,4vw,56px);letter-spacing:-1.6px}h2{font-size:34px}h3{font-size:17px}.muted{color:var(--muted)}.badge{display:inline-block;font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--accent)}header{height:84px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--line);gap:14px}.brand{font-family:Palatino,serif;font-size:31px;letter-spacing:-1px}.brand span{color:var(--accent)}.brand small{font:10px ui-monospace,monospace;letter-spacing:1px;margin-left:14px;color:var(--muted)}nav{display:flex;gap:8px}nav button[aria-current=page]{background:var(--soft);border-color:var(--accent)}main{max-width:1440px;margin:auto;padding:42px 4vw 110px}.heading{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-bottom:28px}.heading p{margin-top:12px;max-width:560px}.sprout{font-size:66px;line-height:1;display:block;color:var(--accent);transform:rotate(-15deg)}.search{display:flex;align-items:center;gap:12px;border:1px solid #536348;border-radius:12px;padding:13px 17px;background:#1d281e;margin-bottom:15px}.search span{color:var(--accent);font-size:24px}.search input{background:none;border:0;outline:none;color:var(--ink);width:100%;font-size:17px;min-width:0}.search kbd{white-space:nowrap;font:11px ui-monospace,monospace;flex-shrink:0}.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}.filters button{border-radius:22px;padding:5px 13px;font-size:12px}.filters button.active{background:var(--accent);color:#182411}.filters .muted{margin-left:auto;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(250px, .9fr) minmax(340px,1.35fr);gap:28px}.results{display:grid;align-content:start;gap:9px}.result{width:100%;text-align:left;padding:19px 20px;border-radius:10px;background:var(--panel)}.result.selected{border-color:var(--accent);background:#243023}.result .meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}.result p{font-size:13px;color:var(--muted);margin-top:7px}.detail{border:1px solid var(--line);border-radius:14px;padding:30px;background:#1b231d;min-height:490px}.detail h2{margin:18px 0}.detail p{margin:14px 0}.detail h3{margin-top:26px}.detail pre{white-space:pre-wrap;background:#111813;padding:18px;border-radius:8px;font:13px/1.8 ui-monospace,monospace;color:var(--accent)}.path{font:11px ui-monospace,monospace;overflow-wrap:anywhere;color:var(--muted);margin-top:24px}.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.links button{font-size:12px}.detail footer{border-top:1px solid var(--line);padding-top:15px;margin-top:25px;display:flex;justify-content:space-between;align-items:center;gap:12px}.note-status{font-size:12px;color:var(--muted)}.focus main{max-width:960px}.focus .heading{text-align:center;display:block;padding:20px 0}.focus .sprout{margin:0 auto 25px}.focus .heading p{margin:16px auto}.focus .workspace{grid-template-columns:1fr}.focus .results{grid-template-columns:repeat(2,1fr)}.focus .result{padding:15px}.focus .detail{max-width:100%}.garden .workspace{grid-template-columns:1fr}.garden .results{grid-template-columns:repeat(3,1fr)}.garden .result{min-height:190px;border-radius:4px 30px 4px 4px;border-top:3px solid #9cba77}.garden .result:nth-child(3n+2){border-top-color:#d7b98b}.garden .result:nth-child(3n){border-top-color:#99c7bd}.garden .detail{max-width:850px;margin:0 auto;width:100%}.garden .heading{border-left:3px solid var(--accent);padding-left:24px}.care{max-width:960px;margin:auto}.care-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:25px 0}.box{padding:25px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.box p{margin:12px 0}.steps{list-style:none;padding:0;margin:20px 0}.steps li{padding:12px 0;border-bottom:1px solid var(--line)}.steps span{color:var(--accent);margin-right:12px}.diff{font:13px/1.9 ui-monospace,monospace;background:#101712;border-radius:8px;padding:18px}.minus{color:#e5afa4}.plus{color:#c7e9a0}.notice{border-left:3px solid #d7b98b;padding:12px 18px;background:#302b20;margin:20px 0;color:#e8d6ad}.switcher{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;border:1px solid #66735a;background:#202b22;border-radius:40px;padding:7px;box-shadow:0 8px 40px #0008;white-space:nowrap;z-index:5}.switcher button{border:0;border-radius:30px}.switcher strong{font-size:12px}.switcher small{display:block;font:9px ui-monospace,monospace;color:var(--muted);text-align:center}.toast{position:fixed;right:22px;bottom:95px;background:var(--accent);color:#182411;padding:12px 20px;border-radius:8px;max-width:calc(100vw - 44px)}.state{font:10px ui-monospace,monospace;color:var(--muted);margin-top:25px;overflow-wrap:anywhere}.empty{padding:35px;border:1px dashed var(--line);border-radius:12px}.setup{max-width:720px;margin:auto}.setup .box{margin-top:20px}select{background:var(--bg);color:var(--ink);padding:9px;border:1px solid var(--line);border-radius:8px}label{display:block;margin:14px 0} @media(max-width:720px){header{height:auto;min-height:85px;padding:15px 5vw;flex-wrap:wrap}.brand small{display:none}main{padding:28px 5vw 120px}.workspace{grid-template-columns:1fr}.detail{padding:22px}.heading .sprout{display:none}.care-grid,.garden .results,.focus .results{grid-template-columns:1fr}.filters .muted{width:100%;margin-left:0}.heading{align-items:start}.switcher{gap:2px}.switcher button{padding:9px}.switcher strong{font-size:11px}}@media(prefers-reduced-motion:no-preference){.detail,.box{animation:appear .2s ease-out}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
<body><header><div class="brand">memori<span>✳</span><small>A KNOWLEDGE COMPANION</small></div><nav aria-label="Main"><button data-page="recall">Recall</button><button data-page="care">Dream <span class="badge">3</span></button><button data-page="setup">Setup</button></nav><span class="badge">Prototype · dummy data</span></header><main id="main"></main><div class="switcher" aria-label="Prototype layouts"><button id="previous" aria-label="Previous layout">←</button><div><strong id="variant-label"></strong><small>DESIGN STUDY · ← → TO SWITCH</small></div><button id="next" aria-label="Next layout">→</button></div><div id="toast" role="status" class="toast" hidden></div>
<script>
const notes=[
{id:'bisect',title:'Find a regression with git bisect',type:'Procedure',tags:['git','debugging'],summary:'Turn a known good commit and a failing test into the exact change that broke it.',body:'When a regression has a known good commit and a reproducible failing test, let Git narrow the search. Keep the test deterministic before you start.',code:'git bisect start\ngit bisect bad HEAD\ngit bisect good <good-commit>\ngit bisect run ./test.sh\ngit bisect reset',lesson:'Always reset bisect when you finish so the next task starts on the expected branch.',links:['tests','repro'],date:'Nov 12'},
{id:'tests',title:'Make the failing test tell the story',type:'Principle',tags:['testing','debugging'],summary:'A small deterministic regression test is a better starting point than a large speculative fix.',body:'Reduce the failure to one observable behavior. Confirm that the test fails for the original reason, then change one thing at a time.',lesson:'A passing test only helps when it exercises the behavior you meant to repair.',links:['repro'],date:'Nov 11'},
{id:'repro',title:'Start with a reproducible failure',type:'Procedure',tags:['debugging'],summary:'Capture the input, command and observed output before changing the implementation.',body:'Use the smallest input that still triggers the bug. Record the environment and one command another person can run. Preserve the original evidence while investigating.',code:'./test.sh --case smallest-failure',lesson:'If the failure disappears, find out why before claiming the fix worked.',links:['bisect'],date:'Nov 10'},
{id:'markdown',title:'Keep knowledge in ordinary files',type:'Decision',tags:['architecture','markdown'],summary:'Markdown is durable; the search index is a disposable projection of the vault.',body:'Humans and agents should be able to read and edit notes without running Memori. SQLite accelerates discovery but is never the only copy of the knowledge.',lesson:'Rebuilding an index should recover search, not recover your only copy of a note.',links:['links','index'],date:'Nov 9'},
{id:'links',title:'Follow the nearest useful connection',type:'Principle',tags:['retrieval','architecture'],summary:'One useful neighbor can add context without flooding the agent with unrelated notes.',body:'Start with the strongest search results. Expand explicit links and backlinks by one hop, keeping a clear distinction between authored connections and semantic similarity.',lesson:'A connection is navigational context, not proof that two claims agree.',links:['markdown'],date:'Nov 8'},
{id:'index',title:'Reindex after editing the vault',type:'Procedure',tags:['markdown','retrieval'],summary:'A file can be safely saved while search still reflects its previous version.',body:'After changing Markdown outside Memori, rebuild the index before checking search results. Report indexing failures separately from file-save failures.',code:'memori index\nmemori search "ordinary files"',lesson:'Saved to disk and available in search are two different states.',links:['markdown'],date:'Nov 7'}];
const variants=['Library','Focus','Garden'];let variant=variants.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'Library';let page='recall',query='',filter='All',selected='bisect',dream='ready',indexed=true;let toastTimer;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(t){const el=document.querySelector('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,3500)}
function related(id){return notes.filter(n=>n.links.includes(id))}
function detail(){const n=notes.find(n=>n.id===selected);if(!n)return '';return `<article class="detail" aria-label="Selected note"><span class="eyebrow">${n.type} / ${n.tags.join(' · ')}</span><h2>${n.title}</h2><p>${n.body}</p>${n.code?`<h3>Try this</h3><pre>${esc(n.code)}</pre>`:''}<h3>Remember</h3><p>${n.lesson}</p><h3>Linked notes <span class="badge">${n.links.length}</span></h3><div class="links">${n.links.map(id=>`<button data-note="${id}">↗ ${notes.find(x=>x.id===id).title}</button>`).join('')}</div><h3>Referenced by</h3><div class="links">${related(n.id).map(x=>`<button data-note="${x.id}">↙ ${x.title}</button>`).join('')||'<span class="muted">No backlinks yet.</span>'}</div><div class="path">vault/${n.type.toLowerCase()}s/${n.id}.md</div><footer><span class="note-status">Edited ${n.date} · synthetic note</span><button data-copy="${n.id}">Copy Markdown</button></footer></article>`}
function visibleNotes(){const words=query.toLowerCase().trim().split(/\s+/).filter(Boolean);return notes.filter(n=>(filter==='All'||n.type===filter)&&words.every(w=>(n.title+' '+n.summary+' '+n.body+' '+n.tags.join(' ')).toLowerCase().includes(w)))}
function results(){const found=visibleNotes();return found.length?found.map((n,i)=>`<button class="result ${selected===n.id?'selected':''}" data-note="${n.id}" aria-pressed="${selected===n.id}"><span class="meta"><span>${n.type.toUpperCase()}</span><span>${query?'Text match':n.date}</span></span><h3>${n.title}</h3><p>${n.summary}</p>${variant==='Garden'?`<div class="links"><span class="badge">${n.links.length+related(n.id).length} connections</span></div>`:''}</button>`).join(''):'<div class="empty"><h3>No matching notes.</h3><p class="muted">Try “git”, “debugging” or “markdown”, or clear the filters.</p><button id="clear">Clear search & filters</button></div>'}
function recall(){return `<section class="heading"><div><span class="eyebrow">YOUR LOCAL KNOWLEDGE VAULT</span><h1>${variant==='Focus'?'What would you like to recall?':variant==='Garden'?'Good ideas grow together.':'You’ve solved this before.'}</h1><p class="muted">${variant==='Garden'?'Explore the small connections that make your knowledge useful.':'Find the lesson. Follow the context. Get back to your work.'}</p></div><span class="sprout" aria-hidden="true">❧</span></section><label class="search"><span aria-hidden="true">⌕</span><input id="search" aria-label="Search notes" placeholder="Search a lesson, command, or idea…" value="${esc(query)}"><kbd>⌘ K</kbd></label><div class="filters">${['All','Procedure','Principle','Decision'].map(t=>`<button class="${filter===t?'active':''}" data-filter="${t}" aria-pressed="${filter===t}">${t==='All'?'All notes':t+'s'}</button>`).join('')}<span class="muted" id="count" role="status">${visibleNotes().length} notes · ${indexed?'index up to date':'index needs refresh'}</span></div><div class="workspace"><section class="results" aria-label="Search results">${results()}</section><div id="detail">${detail()}</div></div><div class="state">Demo state: layout=${variant} · query=${esc(query)||'empty'} · type=${filter} · selected=${selected} · matching uses local text, not real hybrid ranking</div>`}
function care(){return `<section class="care"><span class="eyebrow">A LITTLE CARE FOR YOUR KNOWLEDGE</span><div class="heading"><div><h1>Let the useful parts settle.</h1><p class="muted">A short, bounded tidy-up. Keep the evidence. Make the next recall a little clearer.</p></div><span class="sprout" aria-hidden="true">☾</span></div><div class="care-grid"><div class="box"><span class="badge">SCOPE</span><h3>Since your last dream</h3><ul class="steps"><li><span>01</span>6 changed notes</li><li><span>02</span>Up to 3 improvements</li><li><span>03</span>Archive originals; delete nothing</li></ul><label>Agent <select id="agent"><option>Codex (simulation)</option><option>Claude Code (simulation)</option></select></label><p class="muted">In the real product, the chosen agent may send note content to its provider. This demo sends nothing.</p><button class="primary" id="dream-run" ${dream!=='ready'?'disabled':''}>${dream==='ready'?'Preview a dream':dream==='review'?'Preview ready':'Demo changes applied'}</button></div><div class="box"><span class="badge">${dream==='ready'?'WHAT TO EXPECT':dream==='review'?'REVIEW READY':'COMPLETE'}</span><h3>${dream==='ready'?'Clearer notes, same meaning':dream==='review'?'One merge. One question.':'A tidier vault.'}</h3><p class="muted">${dream==='ready'?'Inspect a proposed merge, check a contradiction, and choose whether to apply the simulated changes.':'Two overlapping debugging notes can become one procedure. A conflicting claim stays unresolved for human judgment.'}</p><p>✓ Original evidence retained<br>✓ Links checked<br>✓ No real files changed</p>${dream==='applied'?'<p class="badge">Simulated commit: demo-8b29c1</p><button id="undo">Undo demo changes</button>':''}</div></div>${dream!=='ready'?`<div class="box"><span class="eyebrow">PROPOSED CHANGE · DEBUGGING/REPRO.MD</span><h2>Keep one stronger procedure.</h2><p class="muted">Combine duplicate guidance; archive the shorter original and retain its source link.</p><div class="diff"><div class="minus">− Reproduce the bug before fixing it.</div><div class="plus">+ Capture the smallest failing input, environment, and one runnable command.</div><div class="plus">+ Confirm the test fails for the original reason before changing code.</div></div><div class="notice"><strong>Needs your judgment</strong><br>“Always mock SQLite” conflicts with “Prefer real SQLite in storage tests.” Both claims are retained. No automatic resolution.</div>${dream==='review'?'<button class="primary" id="apply">Apply simulated merge</button> <button id="discard">Discard preview</button>':'<p class="muted">Preview applied in memory only. Reloading resets the entire prototype.</p>'}</div>`:''}<div class="state">Demo state: dream=${dream} · actual agent runs=0 · actual Git commits=0 · actual vault writes=0</div></section>`}
function setup(){return `<section class="setup"><span class="eyebrow">YOUR FILES. YOUR AGENT. YOUR KNOWLEDGE.</span><h1>Make your next session wiser.</h1><p class="muted">The first win is remembering one useful thing in a different session.</p><div class="box"><span class="badge">01 · CHOOSE A VAULT</span><h3>~/knowledge/memori</h3><p class="muted">Ordinary Markdown files. Open them in Obsidian or your favorite editor. This is a sample path.</p></div><div class="box"><span class="badge">02 · CONNECT YOUR AGENT</span><p>Install the shared Memori skill in Claude Code or Codex. Your agent searches before saving, and keeps only reusable lessons.</p><pre>memori add "A regression needs a deterministic failing test."</pre></div><div class="box"><span class="badge">03 · CHECK THE ROUND TRIP</span><p>${indexed?'The sample index matches the sample vault.':'A simulated external edit has made the index stale.'}</p><button id="edit-demo">Simulate external edit</button> <button class="primary" id="index-demo">Reindex demo</button><p class="muted">In a new agent session, search for the procedure and confirm it can be retrieved.</p><button id="try-recall">Try a recall →</button></div><div class="state">Demo state: indexed=${indexed} · disk writes=0</div></section>`}
function render(){document.body.className=variant.toLowerCase();document.querySelector('#variant-label').textContent=`${variants.indexOf(variant)+1} / 3 · ${variant}`;document.querySelectorAll('[data-page]').forEach(b=>{if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('#main').innerHTML=page==='recall'?recall():page==='care'?care():setup()}
function switchVariant(delta){variant=variants[(variants.indexOf(variant)+delta+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.querySelector('#previous').onclick=()=>switchVariant(-1);document.querySelector('#next').onclick=()=>switchVariant(1);
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;document.querySelector('.results').innerHTML=results();document.querySelector('#count').textContent=`${visibleNotes().length} notes · ${indexed?'index up to date':'index needs refresh'}`;document.querySelector('.state').textContent=`Demo state: layout=${variant} · query=${query||'empty'} · type=${filter} · selected=${selected} · local text matching`}});
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render()}if(b.dataset.note){selected=b.dataset.note;render();if(innerWidth<721)document.querySelector('#detail').scrollIntoView({behavior:'instant',block:'start'})}if(b.dataset.filter){filter=b.dataset.filter;render()}if(b.dataset.copy){const n=notes.find(n=>n.id===b.dataset.copy);try{await navigator.clipboard.writeText(`---\nid: ${n.id}\ntype: ${n.type.toLowerCase()}\ntags: [${n.tags.join(', ')}]\n---\n\n# ${n.title}\n\n${n.body}\n${n.code?'\n```sh\n'+n.code+'\n```\n':''}\n## Remember\n${n.lesson}\n\n## Related\n${n.links.map(id=>'- [['+id+']]').join('\n')}`);notify('Markdown copied')}catch{notify('Clipboard unavailable in this browser context')}}if(b.id==='clear'){query='';filter='All';render()}if(b.id==='dream-run'){dream='review';render()}if(b.id==='apply'){dream='applied';render();notify('Simulated merge applied · no files changed')}if(b.id==='undo'||b.id==='discard'){dream='ready';render();notify('Demo returned to its original state')}if(b.id==='edit-demo'){indexed=false;render()}if(b.id==='index-demo'){indexed=true;render();notify('Demo index refreshed')}if(b.id==='try-recall'){page='recall';query='regression';filter='All';selected='bisect';render()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();page='recall';render();document.querySelector('#search').focus()}if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight')switchVariant(1);if(e.key==='ArrowLeft')switchVariant(-1)});render();
</script></body></html>
